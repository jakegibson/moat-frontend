name: moat
description: Moat v1 Flutter Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  signals: ^6.0.0

  # Dependency Injection
  get_it: ^8.0.2
  injectable: ^2.5.0

  # Navigation
  go_router: ^14.6.2

  # ConnectRPC
  connectrpc: ^1.0.0
  protobuf: ^3.1.0
  fixnum: ^1.1.0

  # Firebase (Auth)
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  google_sign_in: ^6.2.2

  # HTTP Client
  http: ^1.2.2

  # File Handling
  file_picker: ^8.0.0
  url_launcher: ^6.3.0

  # Utilities
  equatable: ^2.0.7
  intl: ^0.19.0

  # Charts
  fl_chart: ^0.69.0

  # SVG
  flutter_svg: ^2.0.10

  # Data Tables
  data_table_2: ^2.6.0

  # Icons
  phosphor_flutter: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  injectable_generator: ^2.6.3

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/images/
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
